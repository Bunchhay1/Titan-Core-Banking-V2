# Docker Profile — titan-core-banking
# Used when SPRING_PROFILES_ACTIVE=docker (set in docker-compose.yml)

server.port=8080

# Database — connects to 'postgres' container (Docker DNS)
spring.datasource.url=jdbc:postgresql://postgres:5432/titandb
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:TitanDB$$ecure2026_X9z!Lp}

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Kafka — INTERNAL listener (kafka:29092)
spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.security.protocol=PLAINTEXT
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3

# Redis — connects to 'redis' container
spring.data.redis.host=redis
spring.data.redis.port=6379

# Disable Zipkin in local Docker
management.tracing.sampling.probability=0.0

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Notification service URL — points to local Docker container
notification.service.url=http://titan-notifications-service:8084

# Kafka Topics
kafka.topic.transaction-completed=banking.transactions.completed
kafka.topic.account-created=banking.accounts.created
kafka.topic.account-updated=banking.accounts.updated
kafka.topic.dlq=banking.transactions.dlq
kafka.topic.atm-withdrawals=banking.atm.withdrawals

# ── ATM Cardless Withdrawal ────────────────────────────────────────────────
# How many minutes a generated code stays valid before expiry.
# Controlled by ATM_CODE_EXPIRY_MINUTES env var (docker-compose default: 10).
atm.code.expiry-minutes=${ATM_CODE_EXPIRY_MINUTES:10}

# Disable optional external services
spring.batch.job.enabled=false
cbdc.node.url=http://localhost:8545
aiops.prometheus.url=http://localhost:9090
aiops.k8s.api.url=https://kubernetes.default.svc

# gRPC AI service (optional — won't crash if not running)
grpc.client.riskEngineClient.address=static://localhost:50051
grpc.client.riskEngineClient.negotiationType=PLAINTEXT
titan.ai.host=localhost
titan.ai.port=50051

# Loans microservice URL — delegate all loan operations
titan.loans-service.url=http://titan-loans-service:8085
