# docker-compose.yml
# High-Frequency Core Banking Enterprise Stack
# Executes PostgreSQL, Redis, Kafka (KRaft), and the Spring Boot 3.2 engine.
services:
  postgres:
    image: postgres:16-alpine
    container_name: titan-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"
      POSTGRES_DB: titandb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d titandb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: titan-redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: titan-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg=="
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # 🚀 Enterprise Kafka Topic Initializer
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    platform: linux/arm64 # Adjust if running on x86_64 (Windows/Linux)
    container_name: titan-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
        echo -e '⏳ Waiting for Kafka broker to accept connections...'
        # Blocks until 1 broker is ready, timeout 30s
        cub kafka-ready -b kafka:29092 1 30

        echo -e '🏗️ Creating Titan Enterprise Kafka topics...'

        # 1. Core Transaction Events (Standard Retention - 7 Days)
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.transactions.completed --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000

        # 2. Immutable Audit Trail (Extended Retention - 30 Days)
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic titan.banking.audit --partitions 3 --replication-factor 1 \
          --config retention.ms=2592000000

        # 3. Promotions & Cashbacks
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.rewards.granted --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.rewards.acknowledgment --partitions 3 --replication-factor 1

        # 4. Dead Letter Queues (DLQ) (Infinite Retention for Manual Replay)
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.transactions.dlq --partitions 1 --replication-factor 1 \
          --config retention.ms=-1

        # 5. Outbound Notifications (Transient - 24 Hours)
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.notifications.push --partitions 3 --replication-factor 1 \
          --config retention.ms=86400000

        # 6. Fraud & Security Alerts (Reconciliation & Red Team monitoring)
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.alerts --partitions 3 --replication-factor 1

        echo -e '✅ Kafka Event Topology Ready:'
        kafka-topics --bootstrap-server kafka:29092 --list
      "
    restart: "no"
  titan-core-banking:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: titan-core-banking
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/titandb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      KAFKA_ENABLED: "true"
      JAVA_OPTS: "-Xmx1024m -Xms512m --enable-preview"
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data: