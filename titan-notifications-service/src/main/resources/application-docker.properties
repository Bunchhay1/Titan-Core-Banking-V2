# Docker Profile — titan-notifications-service
# Used when SPRING_PROFILES_ACTIVE=docker (set in docker-compose.yml)

server.port=8084
spring.application.name=titan-notifications-service

# Database — connects to notificationdb (separate from titandb)
spring.datasource.url=jdbc:postgresql://postgres:5432/notificationdb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:TitanDB$$ecure2026_X9z!Lp}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway — DISABLED for notifications (no migration files exist)
# Hibernate ddl-auto=update handles schema creation automatically
spring.flyway.enabled=false

# Kafka — INTERNAL listener, consumer ENABLED
spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.security.protocol=PLAINTEXT
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.topic=banking.transactions.completed
spring.kafka.dlq.topic=banking.notifications.dlq
# latest = only process NEW messages after startup, never replay old ones.
# This prevents duplicate notifications when the service restarts after being stopped.
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# CRITICAL: activate the @KafkaListener bean in NotificationListener.java
kafka.enabled=true

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379
management.health.redis.enabled=false

# Disable Vault
spring.cloud.vault.enabled=false

# Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.com.titan.notifications=DEBUG
logging.level.org.springframework.kafka=INFO

# ── iOS APNs Push ─────────────────────────────────────────────────────────────
# Set these env vars in docker-compose (or .env) to enable real APNs pushes.
# If left blank the service skips APNs silently (safe for local dev without certs).
apns.key-id=${APNS_KEY_ID:}
apns.team-id=${APNS_TEAM_ID:}
apns.private-key=${APNS_PRIVATE_KEY:}
apns.bundle-id=${APNS_BUNDLE_ID:com.titan.banking}
apns.sandbox=${APNS_SANDBOX:true}

# ── Internal core-banking URL (device token lookup) ───────────────────────────
# Uses Docker DNS — titan-core-banking resolves to the core-banking container.
core.banking.url=http://titan-core-banking:8080
